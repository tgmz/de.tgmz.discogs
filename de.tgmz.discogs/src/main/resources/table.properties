# These queries will get executed after the load and prior to alter

# Add artists which lack in data dump
Artist.1=INSERT INTO Artist (id, name) VALUES (355, 'Unknown Artist')
Artist.2=INSERT INTO Artist (id, name) VALUES (118760, 'No Artist')

# Resolve inconsitencies: Aliases, groups, member which refer to a non-existing artist
artist_artist_all.1=MERGE INTO Artist AS t \
USING (SELECT aa.id, aa.name FROM artist_artist_all aa) AS s \
ON t.id = s.id \
WHEN NOT MATCHED THEN INSERT (id, name) VALUES (s.id, s.name)
artist_artist_all.2=DROP TABLE artist_artist_all

# Labels which refer to a non-existing parent label
Label.1=MERGE INTO Label AS t \
USING (SELECT lla.id, lla.name FROM label_label_all lla) AS s \
ON t.id = s.id \
WHEN NOT MATCHED THEN INSERT (id, name) VALUES (s.id, s.name)
Label.2=DROP TABLE label_label_all

# Setup genres & styles
Master_Genre=INSERT INTO Genre (id) \
SELECT DISTINCT mg.genres_id FROM Master_Genre mg

Master_Style=INSERT INTO Style (id) \
SELECT DISTINCT ms.styles_id FROM Master_Style ms

# Add artist which are referenced in master dump but lack in artist dump
# Usually empty but it doesn't hurt either
artist_master_all.1=MERGE INTO Artist AS t \
USING (SELECT ama.id, ama.name FROM artist_master_all ama) AS s \
ON t.id = s.id \
WHEN NOT MATCHED THEN INSERT (id, name) VALUES (s.id, s.name)
artist_master_all.2=DROP TABLE artist_master_all

# Remove references to non-existing masters
Release.1=UPDATE Release r \
SET master_id = NULL \
WHERE r.master_id IS NOT NULL \
AND NOT EXISTS ( \
SELECT 1 FROM Master m WHERE r.master_id = m.id \
)

Release.2=UPDATE Release r \
SET series_id = NULL \
WHERE r.series_id IS NOT NULL \
AND NOT EXISTS ( \
SELECT 1 FROM Series s WHERE r.series_id = s.id \
)

# Enhance genres & styles
Release_Genre=MERGE INTO Genre AS t \
USING (SELECT DISTINCT genres_id AS id FROM Release_Genre) AS s \
ON s.id = t.id \
WHEN NOT MATCHED THEN INSERT (id) VALUES (s.id)

Release_Style=MERGE INTO Style AS t \
USING (SELECT DISTINCT styles_id AS id FROM Release_Style) AS s \
ON s.id = t.id \
WHEN NOT MATCHED THEN INSERT (id) VALUES (s.id)

# Add referenced non-existing labels
Release_labels.1=MERGE INTO Label AS t \
USING (SELECT lra.id, lra.name FROM label_release_all lra) AS s \
ON t.id = s.id \
WHEN NOT MATCHED THEN INSERT (id, name) VALUES (s.id, s.name)
Release_labels.2=DROP TABLE label_release_all

Format=UPDATE format_gen SET next_val = \
(SELECT MAX(id) + 1 FROM Format) \
WHERE sequence_name = 'Format'

# Enhance artists
artist_release_all.1=MERGE INTO Artist AS t \
USING (SELECT ara.id, ara.name FROM artist_release_all ara) AS s \
ON t.id = s.id \
WHEN NOT MATCHED THEN INSERT (id, name) VALUES (s.id, s.name)
artist_release_all.2=DROP TABLE artist_release_all

# Build up ExtraArtist. Use INSERT as the table is empty and it's faster than MERGE
release_extraartist=INSERT INTO ExtraArtist (role,artist_id) \
SELECT DISTINCT rea.role_id, rea.artist_id FROM release_extraartist rea

Track_ExtraArtist=MERGE INTO ExtraArtist AS t \
USING (SELECT DISTINCT extraArtists_role, extraArtists_artist_id FROM Track_ExtraArtist) AS s \
ON s.extraArtists_role = t.role AND s.extraArtists_artist_id = t.artist_id \
WHEN NOT MATCHED THEN INSERT (role,artist_id) VALUES (s.extraArtists_role,s.extraArtists_artist_id)

SubTrack_ExtraArtist=MERGE INTO ExtraArtist AS t \
USING (SELECT DISTINCT extraArtists_role,extraArtists_artist_id FROM SubTrack_ExtraArtist) AS s \
ON s.extraArtists_role = t.ROLE AND s.extraArtists_artist_id = t.artist_id \
WHEN NOT MATCHED THEN INSERT (role,artist_id) VALUES (s.extraArtists_role,s.extraArtists_artist_id)

